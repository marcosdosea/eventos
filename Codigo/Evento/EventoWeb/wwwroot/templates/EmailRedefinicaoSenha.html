<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="author" content="Itatech Jr">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Redefinição de Senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            margin: auto;
        }

        .btn {
            display: inline-block;
            background-color: #007bff;
            color: #ffffff !important;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 15px;
        }

        footer {
            font-size: 12px;
            color: #777777;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <figure>
                <img src="../img/LOGOTIPO.png" alt="Logo do Boralá estilizado em azul e amarelo" width="136"
                    height="54">
            </figure>
        </header>

        <main>
            <h2>Olá, {{Nome}}!</h2>
            <p>Bora lá alterar sua senha?</p>
            <p>Para redefinir seu acesso, clique no botão abaixo:</p>
            <a href="{{LinkCallback}}" class="btn">Redefinir Minha Senha</a>
        </main>

        <footer>
            <p>Se você não solicitou essa alteração, por favor, ignore este e-mail.</p>
        </footer>
    </div>

</body>

</html>
